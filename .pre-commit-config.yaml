repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # Markdown/HTML/JS may use trailing double-spaces as intentional
        # hard line breaks — never strip them automatically.
        exclude: '\.(md|html|js)$'
      - id: end-of-file-fixer
        exclude: '\.(md|html|js)$'
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: check-file-length
        name: check file length
        entry: python scripts/check_file_length.py
        language: system
        pass_filenames: false
      - id: audit-rls
        name: RLS coverage audit
        entry: python scripts/audit_rls.py --check
        language: system
        pass_filenames: false
      - id: audit-a11y
        name: RTL/WCAG audit
        entry: python scripts/audit_a11y.py --check
        language: system
        pass_filenames: false
      - id: audit-ui-coverage
        name: UI/API reference audit
        entry: python scripts/audit_ui_coverage.py --check
        language: system
        pass_filenames: false
      - id: audit-contrast
        name: Design token contrast audit
        entry: python scripts/audit_contrast.py --check
        language: system
        pass_filenames: false
      # audit_schema.py needs a live migrated PostgreSQL URL; see docs/RUNBOOK.md.
      # It runs in CI (ci.yml) against the Postgres service instead.
