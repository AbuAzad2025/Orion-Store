{% extends "admin_base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h2 class="text-lg font-semibold">المستخدمون</h2>
  <button onclick="OrionAdminPlatform.openUserModal()" class="orion-btn orion-btn-gold text-sm">+ مستخدم جديد</button>
</div>

<div class="orion-card">
  <table class="w-full text-sm">
    <thead><tr class="border-b bg-gray-50 text-right">
      <th class="p-3">Email</th>
      <th class="p-3">الاسم</th>
      <th class="p-3">المتجر</th>
      <th class="p-3">الصلاحيات</th>
      <th class="p-3">الحالة</th>
      <th class="p-3">إجراء</th>
    </tr></thead>
    <tbody id="users-list"><tr><td colspan="6" class="p-3">جارٍ التحميل…</td></tr></tbody>
  </table>
</div>

<div id="user-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="orion-card w-full max-w-md space-y-3">
    <h3 class="font-semibold text-lg">إضافة مستخدم</h3>
    <form id="user-form" class="space-y-3">
      <div>
        <label class="block text-sm mb-1">Email</label>
        <input name="email" id="user-email" type="email" required class="orion-input w-full" aria-label="Email">
      </div>
      <div>
        <label class="block text-sm mb-1">كلمة المرور</label>
        <input name="password" id="user-password" type="password" required class="orion-input w-full" aria-label="Password">
      </div>
      <div>
        <label class="block text-sm mb-1">نوع الحساب</label>
        <select name="user_type" id="user-type" class="orion-input w-full">
          <option value="tenant_admin">مدير متجر</option>
          <option value="platform_admin">مدير منصة</option>
        </select>
      </div>
      <div id="user-tenant-wrap">
        <label class="block text-sm mb-1">المتجر</label>
        <select name="tenant_id" id="user-tenant-id" class="orion-input w-full"></select>
      </div>
      <div class="flex justify-end gap-2 pt-3">
        <button type="button" onclick="OrionAdminPlatform.closeUserModal()" class="px-4 py-2 border rounded text-sm">إلغاء</button>
        <button type="submit" class="orion-btn orion-btn-gold text-sm">حفظ التغييرات</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_platform.js') }}"></script>
<script>OrionAdminPlatform.initUsers();</script>
{% endblock %}
