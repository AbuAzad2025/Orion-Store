{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">قواعد الاحتيال</h2>
    <form id="fraud-rule-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="اسم القاعدة" required>
      <select name="rule_type" class="border rounded px-2 py-1">
        <option value="amount">مبلغ الطلب</option>
        <option value="velocity">تكرار</option>
        <option value="ip">عنوان IP</option>
      </select>
      <select name="operator" class="border rounded px-2 py-1">
        <option value=">">أكبر من</option>
        <option value="<">أصغر من</option>
        <option value="==">يساوي</option>
      </select>
      <input name="threshold_value" type="text" placeholder="الحد" required>
      <select name="action" class="border rounded px-2 py-1">
        <option value="review">مراجعة</option>
        <option value="block">حظر</option>
        <option value="allow">سماح</option>
      </select>
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">إضافة قاعدة</button>
    </form>
    <div id="fraud-rules-list" class="text-gray-500 text-sm">جاري التحميل...</div>
  </section>
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">مراجعة طلب (Fraud Review)</h2>
    <form id="fraud-review-form" class="grid gap-2 max-w-md text-sm">
      <input name="order_id" type="number" placeholder="معرف الطلب" required>
      <input name="risk_score" type="number" placeholder="درجة الخطورة (0-100)">
      <button type="submit" class="rounded bg-amber-600 px-4 py-2 text-white w-fit">مراجعة</button>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_fraud.js') }}"></script>
<script>OrionAdminFraud.init();</script>
{% endblock %}
