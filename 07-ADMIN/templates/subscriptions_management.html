{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">خطط الاشتراك</h2>
    <form id="plan-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="اسم الخطة" required>
      <input name="code" type="text" placeholder="رمز الخطة" required>
      <input name="price" type="number" step="0.01" placeholder="السعر" required>
      <input name="billing_period_days" type="number" placeholder="مدة الفاتورة (أيام)" required>
      <input name="trial_period_days" type="number" placeholder="فترة تجريبية (أيام)" value="0">
      <input name="max_products" type="number" placeholder="الحد الأقصى للمنتجات">
      <input name="max_orders_per_cycle" type="number" placeholder="الحد الأقصى للطلبات">
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">إضافة خطة</button>
    </form>
    <div id="plans-list" class="text-gray-500 text-sm">جاري التحميل...</div>
  </section>
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">الاشتراكات الحالية</h2>
    <div id="customer-subscriptions-list" class="text-gray-500 text-sm">جاري التحميل...</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script>OrionTenantOps.initSubscriptions();</script>
{% endblock %}
