{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">{{ t('خطط الاشتراك', 'Subscription plans') }}</h2>
    <form id="plan-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="{{ t('اسم الخطة', 'Plan name') }}" aria-label="{{ t('اسم الخطة', 'Plan name') }}" required>
      <input name="code" type="text" placeholder="{{ t('رمز الخطة', 'Plan code') }}" aria-label="{{ t('رمز الخطة', 'Plan code') }}" required>
      <input name="price" type="number" step="0.01" placeholder="{{ t('السعر', 'Price') }}" aria-label="{{ t('السعر', 'Price') }}" required>
      <input name="billing_period_days" type="number" placeholder="{{ t('مدة الفاتورة (أيام)', 'Billing period (days)') }}" aria-label="{{ t('مدة الفاتورة (أيام)', 'Billing period (days)') }}" required>
      <input name="trial_period_days" type="number" placeholder="{{ t('فترة تجريبية (أيام)', 'Trial period (days)') }}" aria-label="{{ t('فترة تجريبية (أيام)', 'Trial period (days)') }}" value="0">
      <input name="max_products" type="number" placeholder="{{ t('الحد الأقصى للمنتجات', 'Max products') }}" aria-label="{{ t('الحد الأقصى للمنتجات', 'Max products') }}">
      <input name="max_orders_per_cycle" type="number" placeholder="{{ t('الحد الأقصى للطلبات', 'Max orders') }}" aria-label="{{ t('الحد الأقصى للطلبات', 'Max orders') }}">
      <button type="submit" class="orion-btn orion-btn-gold w-fit">{{ t('إضافة خطة', 'Add plan') }}</button>
    </form>
    <div id="plans-list" class="orion-muted text-sm">{{ t('جارٍ التحميل…', 'Loading…') }}</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">{{ t('الاشتراكات الحالية', 'Current subscriptions') }}</h2>
    <div id="customer-subscriptions-list" class="orion-muted text-sm">{{ t('جارٍ التحميل…', 'Loading…') }}</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script nonce="{{ csp_nonce }}">OrionTenantOps.initSubscriptions();</script>
{% endblock %}
