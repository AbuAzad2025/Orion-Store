{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">تدقيق إمكانية الوصول</h2>
    <form id="audit-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="page_url" type="url" placeholder="رابط الصفحة" required>
      <input name="score" type="number" placeholder="الدرجة (0-100)" required>
      <textarea name="issues" rows="2" placeholder="المشاكل (JSON)" class="orion-input font-mono text-xs"></textarea>
      <button type="submit" class="orion-btn orion-btn-gold w-fit">تسجيل تدقيق</button>
    </form>
    <div id="accessibility-audits-list" class="orion-muted text-sm">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_accessibility.js') }}"></script>
<script>OrionAdminAccessibility.init();</script>
{% endblock %}
