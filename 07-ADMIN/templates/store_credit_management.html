{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">رصيد المتجر</h2>
    <div class="grid gap-2 max-w-md mb-4 text-sm">
      <input id="credit-customer-email" type="email" placeholder="البريد الإلكتروني للعميل">
      <button id="lookup-credit" class="orion-btn orion-btn-gold w-fit">بحث</button>
    </div>
    <div id="credit-balance" class="hidden text-sm mb-4">
      <p>الرصيد: <strong id="credit-amount">0.00</strong></p>
    </div>
    <form id="credit-add-form" class="grid gap-2 max-w-md text-sm hidden">
      <input name="amount" type="number" step="0.01" placeholder="المبلغ" required>
      <input name="reason" type="text" placeholder="السبب">
      <button type="submit" class="orion-btn orion-btn-gold w-fit">إضافة رصيد للعميل</button>
    </form>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">سجل الحركات</h2>
    <div id="credit-transactions" class="orion-muted text-sm">ابحث عن عميل لعرض رصيده.</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script>OrionTenantOps.initStoreCredit();</script>
{% endblock %}
