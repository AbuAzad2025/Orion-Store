{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">تعريفات البيانات الوصفية</h2>
    <form id="metafield-def-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="owner_type" type="text" placeholder="نوع المالك (مثال: product)" required>
      <input name="key" type="text" placeholder="المفتاح" required>
      <input name="label" type="text" placeholder="العنوان" required>
      <select name="field_type" class="orion-input">
        <option value="string">نص</option>
        <option value="integer">رقم صحيح</option>
        <option value="decimal">رقم عشري</option>
        <option value="boolean">نعم/لا</option>
        <option value="json">JSON</option>
      </select>
      <label class="inline-flex items-center gap-2">
        <input name="is_required" type="checkbox" aria-label="مطلوب"> مطلوب
      </label>
      <button type="submit" class="orion-btn orion-btn-gold w-fit">إضافة تعريف</button>
    </form>
    <div id="metafield-defs-list" class="orion-muted text-sm">جارٍ التحميل…</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">قيم البيانات الوصفية</h2>
    <form id="metafield-value-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="definition_id" type="number" placeholder="معرف التعريف" required>
      <input name="owner_id" type="number" placeholder="معرف المالك" required>
      <input name="value" type="text" placeholder="القيمة">
      <button type="submit" class="orion-btn orion-btn-gold w-fit">حفظ قيمة</button>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_metafields.js') }}"></script>
<script>OrionAdminMetafields.init();</script>
{% endblock %}
