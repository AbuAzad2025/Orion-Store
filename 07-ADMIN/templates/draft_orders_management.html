{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">الطلبات المسودة</h2>
    <form id="draft-order-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="customer_email" type="email" placeholder="البريد الإلكتروني للعميل" required>
      <input name="notes" type="text" placeholder="ملاحظات">
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">إنشاء مسودة</button>
    </form>
    <div id="draft-orders-list" class="text-gray-500 text-sm">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script>OrionTenantOps.initDraftOrders();</script>
{% endblock %}
