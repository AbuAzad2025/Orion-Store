{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">برامج المسوقين</h2>
    <form id="affiliate-program-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="اسم البرنامج" required>
      <input name="code" type="text" placeholder="رمز البرنامج" required>
      <select name="commission_type" class="border rounded px-2 py-1">
        <option value="percentage">نسبة مئوية</option>
        <option value="fixed">مبلغ ثابت</option>
      </select>
      <input name="commission_value" type="number" step="0.01" placeholder="قيمة العمولة" required>
      <input name="cookie_days" type="number" placeholder="أيام الكوكي" value="30">
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">إنشاء برنامج</button>
    </form>
    <div id="affiliate-programs-list" class="text-gray-500 text-sm">جارٍ التحميل…</div>
  </section>
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">تسجيل مسوق</h2>
    <form id="affiliate-register-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="program_id" type="number" placeholder="معرف البرنامج" required>
      <input name="email" type="email" placeholder="البريد الإلكتروني" required>
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">تسجيل</button>
    </form>
    <div id="affiliates-list" class="text-gray-500 text-sm">جارٍ التحميل…</div>
  </section>
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">تسجيل عمولة</h2>
    <form id="affiliate-commission-form" class="grid gap-2 max-w-md text-sm">
      <input name="affiliate_id" type="number" placeholder="معرف المسوق" required>
      <input name="order_id" type="number" placeholder="معرف الطلب" required>
      <input name="amount" type="number" step="0.01" placeholder="المبلغ" required>
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">تسجيل عمولة</button>
    </form>
    <div id="commissions-list" class="text-gray-500 text-sm mt-3">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_affiliates.js') }}"></script>
<script>OrionAdminAffiliates.init();</script>
{% endblock %}
