{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section>
    <h2 class="orion-title mb-1">وسائل الدفع</h2>
    <p class="text-sm text-gray-500 mb-4">فعّل ما يناسب متجرك واكتب تعليمات الدفع للزبون. العملات الرقمية غير متاحة.</p>
    <div id="payment-methods-list" class="space-y-3">جارٍ التحميل…</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">ربط باي بال</h2>
    <div class="grid gap-3 max-w-md">
      <input id="paypal-client-id" type="text" placeholder="Client ID" class="border rounded px-3 py-2 text-sm" aria-label="Client ID">
      <input id="paypal-client-secret" type="password" placeholder="Client Secret" class="border rounded px-3 py-2 text-sm" aria-label="Client Secret">
      <label class="inline-flex items-center gap-2 text-sm">
        <input id="paypal-sandbox" type="checkbox" checked aria-label="وضع الاختبار (Sandbox)">
        وضع الاختبار
      </label>
      <button id="connect-paypal" class="orion-btn orion-btn-gold w-fit">حفظ PayPal</button>
    </div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">مزوّدو الدفع بالتقسيط</h2>
    <div id="bnpl-providers-list" class="orion-muted">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_admin.js') }}"></script>
{% endblock %}
