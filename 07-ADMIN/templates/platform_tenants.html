{% extends "admin_base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h2 class="text-lg font-semibold">المتاجر</h2>
  <button onclick="OrionAdminPlatform.openTenantModal()" class="orion-btn orion-btn-gold text-sm">+ متجر جديد</button>
</div>

<div class="orion-card">
  <table class="w-full text-sm">
    <thead><tr class="border-b bg-gray-50 text-start">
      <th class="p-3">الاسم</th>
      <th class="p-3">رابط المتجر</th>
      <th class="p-3">البريد الإلكتروني</th>
      <th class="p-3">الحالة</th>
      <th class="p-3">الإجراءات</th>
    </tr></thead>
    <tbody id="tenants-list"><tr><td colspan="5" class="p-3">جارٍ التحميل…</td></tr></tbody>
  </table>
</div>

<div id="tenant-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="orion-card w-full max-w-md space-y-3">
    <h3 id="tenant-modal-title" class="font-semibold text-lg">إضافة متجر</h3>
    <form id="tenant-form" class="space-y-3">
      <input type="hidden" name="tenant_id" id="tenant-id">
      <div>
        <label class="block text-sm mb-1">اسم المتجر</label>
        <input name="name" id="tenant-name" required class="orion-input w-full" aria-label="اسم المتجر">
      </div>
      <div>
        <label class="block text-sm mb-1">رابط المتجر</label>
        <input name="slug" id="tenant-slug" required class="orion-input w-full" aria-label="رابط المتجر">
      </div>
      <div>
        <label class="block text-sm mb-1">البريد الإلكتروني</label>
        <input name="email" id="tenant-email" type="email" required class="orion-input w-full" aria-label="البريد الإلكتروني">
      </div>
      <div>
        <label class="block text-sm mb-1">النطاق</label>
        <input name="domain" id="tenant-domain" class="orion-input w-full" aria-label="نطاق المتجر">
      </div>
      <div>
        <label class="block text-sm mb-1">الحالة</label>
        <select name="status" id="tenant-status" class="orion-input w-full">
          <option value="trial">تجريبي</option>
          <option value="active">نشط</option>
          <option value="suspended">معلق</option>
        </select>
      </div>
      <div class="flex justify-end gap-2 pt-3">
        <button type="button" onclick="OrionAdminPlatform.closeTenantModal()" class="px-4 py-2 border rounded text-sm">إلغاء</button>
        <button type="submit" class="orion-btn orion-btn-gold text-sm">حفظ التغييرات</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_platform.js') }}"></script>
<script>OrionAdminPlatform.initTenants();</script>
{% endblock %}
