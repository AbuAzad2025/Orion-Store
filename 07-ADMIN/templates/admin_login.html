<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} — Azadexa</title>
  <link rel="stylesheet" href="{{ url_for('admin_assets.static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin_assets.static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin_assets.static', filename='css/orion-theme.css') }}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center orion-surface">
  <form id="login-form" action="/admin/login" method="post" class="bg-white p-8 rounded-lg shadow w-full max-w-md space-y-4">
    <h1 class="text-xl font-bold text-center">Azadexa Admin</h1>
    {% if error %}
    <p class="text-red-600 text-sm text-center">{{ error }}</p>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm mb-1" for="email">البريد</label>
      <input id="email" name="email" type="email" required class="w-full border rounded px-3 py-2" aria-label="Email">
    </div>
    <div>
      <label class="block text-sm mb-1" for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" required class="w-full border rounded px-3 py-2" aria-label="Password">
    </div>
    <div>
      <label class="block text-sm mb-1" for="tenant-slug">Slug المتجر (اختياري)</label>
      <input id="tenant-slug" name="tenant_slug" type="text" class="w-full border rounded px-3 py-2" placeholder="my-store">
    </div>
    <button type="submit" class="orion-btn orion-btn-gold w-full">تسجيل الدخول</button>
  </form>
  <details class="bg-white p-6 rounded-lg shadow w-full max-w-md">
    <summary class="cursor-pointer text-sm text-blue-700">تسجيل الدخول عبر SSO</summary>
    <form action="/admin/sso/exchange" method="post" class="mt-4 space-y-3 text-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm mb-1" for="sso-provider-code">رمز مزوّد SSO</label>
        <input id="sso-provider-code" name="provider_code" type="text" required class="w-full border rounded px-3 py-2" aria-label="SSO provider code">
      </div>
      <div>
        <label class="block text-sm mb-1" for="sso-email">البريد الخارجي</label>
        <input id="sso-email" name="external_email" type="email" required class="w-full border rounded px-3 py-2" aria-label="SSO external email">
      </div>
      <div>
        <label class="block text-sm mb-1" for="sso-tenant">Slug المتجر</label>
        <input id="sso-tenant" name="tenant_slug" type="text" required class="w-full border rounded px-3 py-2" placeholder="my-store">
      </div>
      <button type="submit" class="orion-btn w-full">دخول عبر SSO</button>
    </form>
  </details>
  <script src="{{ url_for('admin_assets.static', filename='js/admin_utils.js') }}"></script>
  <script src="{{ url_for('admin_assets.static', filename='js/api_client.js') }}"></script>
  <script src="{{ url_for('admin_assets.static', filename='js/admin_login.js') }}"></script>
</body>
</html>
