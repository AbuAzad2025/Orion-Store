{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">المناطق الضريبية</h2>
    <form id="tax-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="اسم المنطقة (مثال: إسرائيل)" required>
      <input name="code" type="text" placeholder="رمز المنطقة (مثال: IL)" required>
      <input name="country" type="text" placeholder="الدولة" value="IL">
      <input name="region" type="text" placeholder="المنطقة (اختياري)">
      <button type="submit" class="orion-btn orion-btn-gold w-fit">إضافة منطقة</button>
    </form>
    <div id="tax-jurisdictions-list" class="orion-muted text-sm">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script>OrionTenantOps.initTax();</script>
{% endblock %}
