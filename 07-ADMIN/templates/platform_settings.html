{% extends "admin_base.html" %}
{% block content %}
<h2 class="text-lg font-semibold mb-4">إعدادات المنصة</h2>

<form id="settings-form" class="bg-white rounded border p-6 max-w-lg space-y-4">
  <div>
    <label class="block text-sm mb-1">اسم المنصة</label>
    <input name="platform_name" id="setting-platform-name" class="orion-input w-full" aria-label="Platform Name">
  </div>
  <div>
    <label class="block text-sm mb-1">اسم المالك</label>
    <input name="owner_name" id="setting-owner-name" class="orion-input w-full" aria-label="Owner Name">
  </div>
  <div>
    <label class="block text-sm mb-1">Email الدعم</label>
    <input name="support_email" id="setting-support-email" type="email" class="orion-input w-full" aria-label="Support Email">
  </div>
  <div>
    <label class="block text-sm mb-1">العملة الافتراضية</label>
    <input name="default_currency" id="setting-default-currency" class="orion-input w-full" aria-label="Default Currency">
  </div>
  <div>
    <label class="block text-sm mb-1">اللغة الافتراضية</label>
    <input name="default_language" id="setting-default-language" class="orion-input w-full" aria-label="Default Language">
  </div>
  <button type="submit" class="orion-btn orion-btn-gold text-sm">حفظ الإعدادات</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_platform.js') }}"></script>
<script>OrionAdminPlatform.initSettings();</script>
{% endblock %}
