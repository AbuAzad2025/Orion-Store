{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">أسعار العملات</h2>
    <p class="orion-muted text-xs mb-3">إدارة أسعار الصرف متاحة لمسؤولي المنصة فقط، وتُطبّق على جميع المتاجر.</p>
    <form id="currency-rate-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="from_currency" type="text" placeholder="من (مثال: USD)" required maxlength="3">
      <input name="to_currency" type="text" placeholder="إلى (مثال: EUR)" required maxlength="3">
      <input name="rate" type="number" step="0.000001" placeholder="السعر" required>
      <button type="submit" class="orion-btn orion-btn-gold w-fit">إضافة سعر</button>
    </form>
    <div id="currency-rates-list" class="orion-muted text-sm">جارٍ التحميل…</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">تحويل عملة</h2>
    <div class="grid gap-2 max-w-md text-sm">
      <input id="conv-amount" type="number" placeholder="المبلغ" value="100">
      <input id="conv-from" type="text" placeholder="من" value="USD" maxlength="3">
      <input id="conv-to" type="text" placeholder="إلى" value="ILS" maxlength="3">
      <button id="btn-convert" class="orion-btn orion-btn-gold w-fit">تحويل</button>
      <p id="conv-result" class="orion-title mt-2"></p>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_currency.js') }}"></script>
<script>OrionAdminCurrency.init();</script>
{% endblock %}
