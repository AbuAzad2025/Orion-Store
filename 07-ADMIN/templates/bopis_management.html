{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">{{ t('مواقع الاستلام', 'Pickup Locations') }}</h2>
    <form id="bopis-location-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="{{ t('اسم الموقع', 'Location name') }}" required>
      <input name="address" type="text" placeholder="{{ t('العنوان', 'Address') }}" required>
      <input name="phone" type="text" placeholder="{{ t('الهاتف', 'Phone') }}">
      <button type="submit" class="orion-btn orion-btn-gold w-fit">{{ t('إضافة موقع', 'Add location') }}</button>
    </form>
    <div id="bopis-locations-list" class="orion-muted text-sm">{{ t('جارٍ التحميل…', 'Loading…') }}</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script nonce="{{ csp_nonce }}">OrionTenantOps.initBopis();</script>
{% endblock %}
