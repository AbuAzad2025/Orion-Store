{% extends "admin_base.html" %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
  <section class="orion-card lg:col-span-2">
    <div class="flex items-center justify-between mb-4">
      <h2 class="orion-title">قسائم الخصم</h2>
      <button type="button" id="btn-refresh" class="orion-btn">تحديث</button>
    </div>
    <div id="vouchers-list" class="space-y-2">جاري التحميل...</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-4">إضافة قسيمة</h2>
    <form id="voucher-form" class="space-y-3">
      <div>
        <label class="orion-stat-label" for="v-code">الرمز</label>
        <input id="v-code" class="orion-input" required aria-label="رمز القسيمة" dir="ltr">
      </div>
      <div>
        <label class="orion-stat-label" for="v-name">الاسم</label>
        <input id="v-name" class="orion-input" required aria-label="اسم القسيمة">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="orion-stat-label" for="v-type">النوع</label>
          <select id="v-type" class="orion-select" aria-label="نوع الخصم">
            <option value="percentage">نسبة مئوية</option>
            <option value="fixed_amount">مبلغ ثابت</option>
          </select>
        </div>
        <div>
          <label class="orion-stat-label" for="v-value">القيمة</label>
          <input id="v-value" type="number" step="0.01" min="0" class="orion-input" required aria-label="قيمة الخصم">
        </div>
      </div>
      <div>
        <label class="orion-stat-label" for="v-limit">حد الاستخدام (اختياري)</label>
        <input id="v-limit" type="number" min="1" class="orion-input" aria-label="حد الاستخدام">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="orion-stat-label" for="v-start">من تاريخ</label>
          <input id="v-start" type="date" class="orion-input" aria-label="تاريخ البداية">
        </div>
        <div>
          <label class="orion-stat-label" for="v-end">إلى تاريخ</label>
          <input id="v-end" type="date" class="orion-input" aria-label="تاريخ النهاية">
        </div>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input id="v-free-shipping" type="checkbox" aria-label="شحن مجاني"> شحن مجاني
      </label>
      <button type="submit" class="orion-btn orion-btn-gold w-full">حفظ القسيمة</button>
      <p id="voucher-msg" class="orion-muted text-sm" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_vouchers.js') }}"></script>
<script>OrionAdminVouchers.init();</script>
{% endblock %}
