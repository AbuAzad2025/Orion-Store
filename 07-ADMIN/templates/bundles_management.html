{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="rounded border bg-white p-4">
    <h2 class="text-lg font-semibold mb-3">الحزم</h2>
    <form id="bundle-form" class="grid gap-2 max-w-md mb-4 text-sm">
      <input name="name" type="text" placeholder="اسم الحزمة" required>
      <input name="slug" type="text" placeholder="رمز الحزمة (slug)" required dir="ltr">
      <input name="bundle_price" type="number" step="0.01" placeholder="سعر الحزمة" required>
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white w-fit">إضافة حزمة</button>
    </form>
    <div id="bundles-list" class="text-gray-500 text-sm">جارٍ التحميل…</div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/tenant_ops.js') }}"></script>
<script>OrionTenantOps.initBundles();</script>
{% endblock %}
