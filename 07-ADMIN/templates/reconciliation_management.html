{% extends "admin_base.html" %}
{% block content %}
<div class="space-y-6">
  <section class="orion-card">
    <h2 class="orion-title mb-3">{{ t('جولات التسوية المالية', 'Reconciliation runs') }}</h2>
    <button id="btn-create-run" class="rounded bg-blue-600 px-4 py-2 text-white text-sm mb-4">{{ t('بدء جولة تسوية', 'Start reconciliation run') }}</button>
    <div id="reconciliation-runs-list" class="orion-muted text-sm">{{ t('جارٍ التحميل…', 'Loading…') }}</div>
  </section>
  <section class="orion-card">
    <h2 class="orion-title mb-3">{{ t('إضافة بند للمطابقة', 'Add reconciliation item') }}</h2>
    <form id="reconciliation-item-form" class="grid gap-2 max-w-md text-sm">
      <input name="run_id" type="number" placeholder="{{ t('معرف التشغيل', 'Run ID') }}" required>
      <input name="financial_event_id" type="number" placeholder="{{ t('معرف الحدث المالي', 'Financial event ID') }}" required>
      <input name="expected_amount" type="number" step="0.01" placeholder="{{ t('المبلغ المتوقع', 'Expected amount') }}" required>
      <input name="actual_amount" type="number" step="0.01" placeholder="{{ t('المبلغ الفعلي', 'Actual amount') }}" required>
      <button type="submit" class="orion-btn orion-btn-gold w-fit">{{ t('إضافة بند', 'Add item') }}</button>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('admin_assets.static', filename='js/admin_reconciliation.js') }}"></script>
<script nonce="{{ csp_nonce }}">OrionAdminReconciliation.init();</script>
{% endblock %}
