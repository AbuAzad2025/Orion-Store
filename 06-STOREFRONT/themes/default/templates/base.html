<!DOCTYPE html>
<html lang="{{ locale|default('ar') }}" dir="{{ 'rtl' if locale[:2]|lower in ['ar','he'] else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ url_for('storefront_assets.static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('storefront_assets.static', filename='css/orion-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('storefront_assets.static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('storefront_assets.static', filename='css/rtl.css') }}">
</head>
<body class="bg-gray-50 min-h-screen orion-surface" data-tenant-id="{{ tenant.slug }}">
  {% include "components/header.html" %}
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  {% include "components/footer.html" %}
  <script src="{{ url_for('storefront_assets.static', filename='js/store_utils.js') }}"></script>
  <script src="{{ url_for('storefront_assets.static', filename='js/store_api.js') }}"></script>
  <script src="{{ url_for('storefront_assets.static', filename='js/lazy_load.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
