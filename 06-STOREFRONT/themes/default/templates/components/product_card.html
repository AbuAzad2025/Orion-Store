<div class="orion-card">
  <a href="/product/{{ product.slug }}">
    {% if product.image_url %}
    <img src="{{ product.image_url }}" alt="{{ product.name }}"
         class="w-full h-40 object-cover rounded mb-3 border border-slate-800" loading="lazy">
    {% else %}
    <div class="w-full h-40 rounded mb-3 flex items-center justify-center border border-slate-800 orion-muted text-sm">
      لا توجد صورة
    </div>
    {% endif %}
    <h3 class="orion-title mb-1">{{ product.name }}</h3>
    <p class="orion-eyebrow">{{ product.price }} ₪</p>
  </a>
  <button data-add-cart="{{ product.id }}" class="orion-btn orion-btn-gold mt-3 w-full text-sm">أضف للسلة</button>
  {% set wa_order = whatsapp_url(tenant.phone, 'مرحباً، أريد طلب: ' ~ product.name) %}
  {% if wa_order %}
  <a href="{{ wa_order }}" target="_blank" rel="noopener"
     class="orion-btn mt-2 w-full text-sm" aria-label="اطلب {{ product.name }} عبر واتساب">
    اطلب عبر واتساب
  </a>
  {% endif %}
</div>
