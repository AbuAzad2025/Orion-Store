{% extends "base.html" %}
{% block content %}
<section class="orion-login-page max-w-md mx-auto">
  <header class="mb-6" style="text-align:center">
    <p class="orion-eyebrow">{{ tenant.name_for(locale) }}</p>
    <h1 class="orion-title text-2xl">{{ t('sign_in') }}</h1>
    <p class="orion-muted text-sm">
      {{ t('login_hint') }}
    </p>
  </header>

  {% if request.args.get('error') %}
  <p class="orion-auth-error" role="alert">
    {{ t('invalid_credentials') }}
  </p>
  {% endif %}

  <form method="post" action="/s/{{ tenant.slug }}/login" class="space-y-4">
    <input type="hidden" name="store" value="{{ store_token }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="orion-stat-label block" for="login-email">{{ t('email_address') }}</label>
      <input id="login-email" name="email" type="email" required class="orion-input w-full" autocomplete="username">
    </div>
    <div>
      <label class="orion-stat-label block" for="login-password">
        {{ t('password') }}
      </label>
      <input id="login-password" name="password" type="password" required class="orion-input w-full" autocomplete="current-password">
    </div>
    <button type="submit" class="orion-btn orion-btn-gold w-full">{{ t('sign_in') }}</button>
  </form>

  <p class="orion-login-note" style="margin-block-start:1.25rem;text-align:center">
    <a href="{{ store_admin_login_url }}" class="orion-login-inline">
      {{ t('store_admin_sign_in') }}
    </a>
  </p>
</section>
{% endblock %}
