{% extends "base.html" %}
{% block content %}
<h1 class="orion-title text-2xl mb-6">إتمام الطلب</h1>
<form id="checkout-form" class="orion-card max-w-md space-y-4">
  <div>
    <label class="orion-stat-label block" for="customer-email">البريد الإلكتروني</label>
    <input id="customer-email" type="email" required class="orion-input w-full" aria-label="Customer Email">
  </div>
  <div>
    <label class="orion-stat-label block" for="shipping-city">المدينة</label>
    <input id="shipping-city" type="text" required class="orion-input w-full" aria-label="Shipping City">
  </div>
  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="orion-stat-label block" for="shipping-country">الدولة (رمز من حرفين)</label>
      <input id="shipping-country" type="text" maxlength="2" class="orion-input w-full" placeholder="PS" dir="ltr" aria-label="Shipping country code">
    </div>
    <div>
      <label class="orion-stat-label block" for="shipping-region">المنطقة (اختياري)</label>
      <input id="shipping-region" type="text" class="orion-input w-full" aria-label="Shipping region">
    </div>
  </div>
  <div>
    <label class="orion-stat-label block" for="shipping-method">طريقة الشحن</label>
    <select id="shipping-method" class="orion-input w-full">
      <option value="">جاري التحميل...</option>
    </select>
  </div>
  <div id="pickup-row" class="hidden">
    <label class="orion-stat-label block" for="pickup-location">استلام من المتجر (اختياري)</label>
    <select id="pickup-location" class="orion-input w-full" aria-label="موقع الاستلام">
      <option value="">توصيل عادي</option>
    </select>
  </div>
  <div>
    <label class="orion-stat-label block" for="voucher-code">كود الخصم (اختياري)</label>
    <input id="voucher-code" type="text" class="orion-input w-full" placeholder="SAVE10">
  </div>
  <div>
    <label class="orion-stat-label block" for="payment-method">طريقة الدفع</label>
    <select id="payment-method" class="orion-input w-full">
      <option value="">جاري التحميل...</option>
    </select>
  </div>
  <label class="flex items-center gap-2 text-sm" id="use-credit-row">
    <input id="use-store-credit" type="checkbox" aria-label="استخدام رصيد المتجر"> استخدام رصيد المتجر
  </label>
  <p id="checkout-summary" class="text-sm text-gray-600"></p>
  <button type="submit" class="orion-btn orion-btn-gold w-full">ادفع الآن</button>
</form>
<div id="checkout-result" class="mt-4 text-sm"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('storefront_assets.static', filename='js/checkout.js') }}"></script>
{% endblock %}
