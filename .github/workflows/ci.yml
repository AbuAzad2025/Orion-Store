name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & file limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Black
        run: black --check --exclude "tests/api/_*" 02-CORE 03-MODELS 04-SERVICES 05-API 06-STOREFRONT 07-ADMIN tests scripts

      - name: isort
        run: isort --check-only --skip-glob tests/api/_* 02-CORE 03-MODELS 04-SERVICES 05-API 06-STOREFRONT 07-ADMIN tests scripts

      - name: Flake8
        run: flake8 --exclude=tests/api/_debug_imp.py,tests/api/_imp_debug2.py,tests/api/_imp_debug3.py 02-CORE 03-MODELS 04-SERVICES 05-API 06-STOREFRONT 07-ADMIN tests scripts

      - name: File length check
        run: python scripts/check_file_length.py

  test:
    name: Tests, PostgreSQL & coverage ≥85%
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: orion_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orion_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bootstrap PostgreSQL schema
        env:
          DATABASE_URL: postgresql://postgres:123@localhost:5432/orion_test_db
          TEST_DATABASE_URL: postgresql://postgres:123@localhost:5432/orion_test_db
        run: |-
          python - << 'PY'
          import os
          import sys
          os.environ['DATABASE_URL'] = 'postgresql://postgres:123@localhost:5432/orion_test_db'
          os.environ['TEST_DATABASE_URL'] = 'postgresql://postgres:123@localhost:5432/orion_test_db'
          os.environ.setdefault('FLASK_ENV', 'testing')
          ROOT = os.path.abspath('.')
          for p in [ROOT, os.path.join(ROOT, '02-CORE'), os.path.join(ROOT, '03-MODELS'), os.path.join(ROOT, '04-SERVICES'), os.path.join(ROOT, '05-API'), os.path.join(ROOT, '06-STOREFRONT'), os.path.join(ROOT, '07-ADMIN')]:
              if p not in sys.path:
                  sys.path.insert(0, p)
          from orion.app import create_app
          from flask_migrate import upgrade
          app = create_app('testing')
          with app.app_context():
              upgrade()
              print('MIGRATION_OK')
          PY

      - name: Pytest with PostgreSQL and coverage gate
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://postgres:123@localhost:5432/orion_test_db
          TEST_DATABASE_URL: postgresql://postgres:123@localhost:5432/orion_test_db
        run: |-
          export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          pytest -v -m "not external" \
            --cov \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage.xml
          retention-days: 14

  coverage-gate:
    name: Per-file coverage gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyyaml

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports

      - name: Enforce coverage manifest
        run: |-
          ARGS="--coverage-json coverage.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            ARGS="$ARGS --diff-base origin/${{ github.base_ref }}"
          fi
          python scripts/check_coverage.py $ARGS

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pip-audit
        run: pip-audit --strict
