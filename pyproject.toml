[project]
name = "orion-ecommerce"
version = "0.1.0"
description = "Azadexa multi-tenant e-commerce SaaS (Orion engine)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.52",
    "Flask-Migrate==4.0.7",
    "psycopg2-binary==2.9.12",
    "redis==6.1.0",
    "Flask-Limiter==3.8.0",
    "prometheus-client==0.19.0",
    "sentry-sdk==2.19.2",
    "celery[redis]==5.4.0",
    "python-dotenv==1.2.2",
    "cryptography==50.0.0",
    "requests==2.33.0",
    "Flask-JWT-Extended==4.7.1",
    "Flask-WTF==1.2.2",
    "bcrypt==4.1.2",
    "fpdf2==2.8.8",
    "Pillow==13.0.0",
    "uharfbuzz==0.57.0",
    "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-flask==1.3.0",
    "black==26.10.1",
    "flake8==7.0.0",
    "isort==5.13.2",
    "pre-commit==3.6.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "coverage==7.4.4",
    "pyyaml==6.0.3",
    "vcrpy==8.2.1",
    "pip-audit==2.7.0",
    "bandit==1.7.9",
    "playwright==1.62.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["orion", "core", "base", "v1", "auth", "tenant", "tenant_svc", "user", "integrations", "catalog", "catalog_svc", "platform_models", "platform_svc", "order", "order_svc", "payment", "payment_svc", "tenant_gateway_svc", "bnpl", "bnpl_svc", "bundle", "returns", "rma_svc", "b2b", "b2b_svc", "oms", "oms_svc", "notification_svc", "backup_svc", "engine", "tenant_admin", "platform_admin", "admin_assets"]

[tool.coverage.run]
source = ["02-CORE", "03-MODELS", "04-SERVICES", "05-API"]
omit = [
    "*/__init__.py",
    "**/wsgi.py",
    "03-MODELS/base/mixins.py",
    "**/tests/**",
]
relative_files = true

[tool.coverage.report]
precision = 1
show_missing = true
fail_under = 99

[tool.pytest.ini_options]
testpaths = ["tests", "02-CORE/tests"]
pythonpath = [".", "02-CORE", "03-MODELS", "04-SERVICES", "05-API", "06-STOREFRONT", "07-ADMIN"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: Pure logic — no route/HTTP.",
    "integration: Full-stack checks on PostgreSQL (CHECK, FK, RLS).",
    "external: Recorded or live third-party HTTP (VCR) — excluded from CI.",
    "e2e: Browser tests (Playwright + Chromium) — excluded from default CI.",
]
addopts = "-ra"

[tool.orion.file_length]
default_max = 500
paths = [
    # Legacy large files — split gradually; documented exceptions only.
    { glob = "03-MODELS/subscription/subscription.py", max = 350 },
    { glob = "05-API/v1/tenant_portal.py", max = 400 },
    { glob = "05-API/v1/storefront.py", max = 380 },
    { glob = "06-STOREFRONT/engine/routes.py", max = 530 },
    { glob = "**/orion-theme.css", max = 1425 },
    { glob = "migrations/versions/20261119_0001_baseline_tables.py", max = 400 },
    { glob = "migrations/versions/20261119_0002_baseline_indexes.py", max = 400 },
    { glob = "tests/api/test_auth_tenant_admin.py", max = 900 },
    { glob = "tests/api/test_v2_api.py", max = 700 },
    { glob = "tests/api/test_coverage_expansion_api.py", max = 1500 },
    { glob = "tests/services/test_coverage_expansion_services.py", max = 1150 },
    { glob = "tests/api/test_coverage_push_api.py", max = 1000 },
    { glob = "tests/services/test_coverage_push_services.py", max = 1000 },
    { glob = "tests/core/test_coverage_push_core.py", max = 1000 },
    { glob = "tests/services/test_coverage_final_services.py", max = 1300 },
    { glob = "**/*_service.py", max = 400 },
    { glob = "05-API/v1/*.py", max = 300 },
    { glob = "03-MODELS/**/*.py", max = 250 },
    { glob = "migrations/versions/*.py", max = 200 },
]
